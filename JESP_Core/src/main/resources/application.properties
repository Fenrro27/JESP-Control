spring.application.name=JESP_Core

server.port=5001

spring.datasource.url=jdbc:sqlite:${JESP_DB_PATH:jesp_data.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jesp.rules-file=${JESP_RULES_FILE:rules.conf}
jesp.ws-port=${JESP_WS_PORT:5000}

# Autenticacion
jesp.jwt-secret=${JESP_JWT_SECRET:jesp-default-dev-secret-change-me-please-32}
jesp.jwt-expiration-minutes=${JESP_JWT_EXPIRATION_MINUTES:720}
jesp.admin-password=${JESP_ADMIN_PASSWORD:}
jesp.cors-origins=${JESP_CORS_ORIGINS:http://localhost:5173}

# Motor de reglas: sensores sin datos durante este tiempo se consideran obsoletos
jesp.sensor-staleness-seconds=${JESP_SENSOR_STALENESS:300}
# Accion failsafe cuando el sensor esta obsoleto y hay reglas de sensor: OFF o KEEP
jesp.stale-failsafe=${JESP_STALE_FAILSAFE:OFF}

# Build de la SPA (JESP_MobileApp) copiado aqui para servirla en produccion
spring.web.resources.static-locations=classpath:/static/
